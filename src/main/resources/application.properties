spring.application.name=erp
server.port=${SERVER_PORT:8080}

# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT — must be Base64-encoded. No default: an unset JWT_SECRET must fail startup
# rather than silently fall back to a value that's sitting in git history.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Refresh token lifetime (7 days), stored server-side in refresh_tokens so it can be revoked
jwt.refresh-expiration=604800000

# Default admin seeded at startup if it doesn't already exist — change this password
# before deploying anywhere real.
seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}

# Monitoring — health check is public (/actuator/health); metrics and other
# actuator endpoints require ADMIN (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# File uploads (e.g. company logos) — served back at /uploads/** (see WebConfig)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Object storage (S3-compatible — MinIO locally) backing the generic
# /api/files/upload endpoint (see S3Config / S3FileStorageService).
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
s3.bucket=${S3_BUCKET:}
# Overridden to point at MinIO (or any non-AWS S3-compatible endpoint); left
# blank to talk to real AWS S3.
s3.endpoint=${S3_ENDPOINT:}
# Used to build the URL handed back to callers — separate from s3.endpoint
# because the app may reach MinIO over a Docker-internal host while browsers
# need a publicly routable one.
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${s3.endpoint}}

# SMTP — backs EmailService (document-email sending). Blank host means
# sends will fail until real credentials are supplied via env vars; works
# with any SMTP provider (Gmail app password, SendGrid/Mailgun relay, a
# real mail server, or Mailhog locally).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@example.com}
mail.from-name=${MAIL_FROM_NAME:ERP System}
